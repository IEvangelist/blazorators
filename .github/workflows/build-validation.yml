name: build and test

on:
  push:
    branches: [ main ]
    paths-ignore:
    - README.md
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for running the workflow
        required: true
        default: Manual run

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
        - Blazor.SourceGenerators
        - Blazor.Serialization
        - Blazor.LocalStorage.WebAssembly
        - Blazor.LocalStorage
        - Blazor.SessionStorage.WebAssembly
        - Blazor.SessionStorage
        - Blazor.Geolocation.WebAssembly
        - Blazor.Geolocation
        - Blazor.SpeechSynthesis.WebAssembly
        - Blazor.SpeechSynthesis
        - Blazor.SpeechRecognition.WebAssembly
        - Blazor.SpeechRecognition
        - Blazor.DOM
        - Blazor.DOM.WebAssembly
        - Blazor.Permissions
        - Blazor.Permissions.WebAssembly
        - Blazor.WakeLock
        - Blazor.WakeLock.WebAssembly
    steps:
    - uses: actions/checkout@main

    - name: 'Print manual run reason'
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        echo 'Reason: ${{ github.event.inputs.reason }}'
    - name: Setup .NET
      uses: actions/setup-dotnet@main
      with:
        global-json-file: global.json

    - name: Restore dependencies for ${{ matrix.project }}
      run: |
        dotnet restore ./src/${{ matrix.project }}/${{ matrix.project }}.csproj
      
    - name: Build ${{ matrix.project }}
      run: |
        dotnet build ./src/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --no-restore

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@main
    
    - name: Setup .NET
      uses: actions/setup-dotnet@main
      with:
        global-json-file: global.json

    - name: Run tests
      run: |
        dotnet test ./tests/Blazor.SourceGenerators.Tests/Blazor.SourceGenerators.Tests.csproj --verbosity normal

    - name: Run DOM C# generator tests
      run: |
        dotnet test ./tests/Blazor.DOM.CSharpGenerator.Tests/Blazor.DOM.CSharpGenerator.Tests.csproj --configuration Release --verbosity normal

    - name: Run Wake Lock focused package tests
      run: |
        dotnet test ./tests/Blazor.WakeLock.Tests/Blazor.WakeLock.Tests.csproj --configuration Release --verbosity normal

    - name: Restore DOM global namespace compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.GlobalNamespace.CompilationTests/Blazor.DOM.GlobalNamespace.CompilationTests.csproj

    - name: Build DOM global namespace compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.GlobalNamespace.CompilationTests/Blazor.DOM.GlobalNamespace.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.GlobalNamespace.CompilationTests/Blazor.DOM.GlobalNamespace.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.GlobalNamespace.CompilationTests/Blazor.DOM.GlobalNamespace.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Build exhaustive DOM host consumers with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.Server.CompilationTests/Blazor.DOM.Server.CompilationTests.csproj --configuration Release --warnaserror
        dotnet build ./tests/Blazor.DOM.WebAssembly.CompilationTests/Blazor.DOM.WebAssembly.CompilationTests.csproj --configuration Release --warnaserror

    - name: Restore DOM generic compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.Generic.CompilationTests/Blazor.DOM.Generic.CompilationTests.csproj

    - name: Build DOM generic compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.Generic.CompilationTests/Blazor.DOM.Generic.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.Generic.CompilationTests/Blazor.DOM.Generic.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.Generic.CompilationTests/Blazor.DOM.Generic.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Restore DOM Wake Lock compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.WakeLock.CompilationTests/Blazor.DOM.WakeLock.CompilationTests.csproj

    - name: Build DOM Wake Lock compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.WakeLock.CompilationTests/Blazor.DOM.WakeLock.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.WakeLock.CompilationTests/Blazor.DOM.WakeLock.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.WakeLock.CompilationTests/Blazor.DOM.WakeLock.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Restore DOM advanced type compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.AdvancedTypes.CompilationTests/Blazor.DOM.AdvancedTypes.CompilationTests.csproj

    - name: Build DOM advanced type compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.AdvancedTypes.CompilationTests/Blazor.DOM.AdvancedTypes.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.AdvancedTypes.CompilationTests/Blazor.DOM.AdvancedTypes.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.AdvancedTypes.CompilationTests/Blazor.DOM.AdvancedTypes.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Restore DOM typed union compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.TypedUnions.CompilationTests/Blazor.DOM.TypedUnions.CompilationTests.csproj

    - name: Build DOM typed union compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.TypedUnions.CompilationTests/Blazor.DOM.TypedUnions.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.TypedUnions.CompilationTests/Blazor.DOM.TypedUnions.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.TypedUnions.CompilationTests/Blazor.DOM.TypedUnions.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Restore DOM accessor compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.Accessors.CompilationTests/Blazor.DOM.Accessors.CompilationTests.csproj

    - name: Build DOM accessor compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.Accessors.CompilationTests/Blazor.DOM.Accessors.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.Accessors.CompilationTests/Blazor.DOM.Accessors.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.Accessors.CompilationTests/Blazor.DOM.Accessors.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Restore DOM typed event compilation tests
      run: |
        dotnet restore ./tests/Blazor.DOM.TypedEvents.CompilationTests/Blazor.DOM.TypedEvents.CompilationTests.csproj

    - name: Build DOM typed event compilation tests with warnings as errors
      run: |
        dotnet build ./tests/Blazor.DOM.TypedEvents.CompilationTests/Blazor.DOM.TypedEvents.CompilationTests.csproj --configuration Release --framework net8.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.TypedEvents.CompilationTests/Blazor.DOM.TypedEvents.CompilationTests.csproj --configuration Release --framework net9.0 --no-restore --warnaserror
        dotnet build ./tests/Blazor.DOM.TypedEvents.CompilationTests/Blazor.DOM.TypedEvents.CompilationTests.csproj --configuration Release --framework net10.0 --no-restore --warnaserror

    - name: Build remaining DOM profile compilation tests with warnings as errors
      run: |
        for project in NonEventDeferrals ResolvedFailures SupplementalBrowserApis; do
          dotnet build "./tests/Blazor.DOM.${project}.CompilationTests/Blazor.DOM.${project}.CompilationTests.csproj" --configuration Release --warnaserror
        done

    - name: Build end-to-end tests
      run: |
        dotnet build ./tests/Blazor.ExampleConsumer.EndToEndTests/Blazor.ExampleConsumer.EndToEndTests.csproj --configuration Release

    - name: Install Playwright dependencies
      run: |
        pwsh ./artifacts/bin/Blazor.ExampleConsumer.EndToEndTests/release/playwright.ps1 install --with-deps

    - name: Run end-to-end tests
      run: |
        dotnet test ./tests/Blazor.ExampleConsumer.EndToEndTests/Blazor.ExampleConsumer.EndToEndTests.csproj --verbosity normal