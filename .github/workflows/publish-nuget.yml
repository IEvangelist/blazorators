name: publish nuget

# Publishes the Blazor.* packages to nuget.org using NuGet Trusted Publishing
# (OIDC). No long-lived API keys — the workflow exchanges a short-lived GitHub
# OIDC token for a temporary API key valid for 1 hour.
#
# nuget.org policy:
#   Repository Owner: IEvangelist
#   Repository:       blazorators
#   Workflow File:    publish-nuget.yml
#   Environment:      production

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Existing release tag or commit to publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          filter: tree:0
          ref: ${{ inputs.release_ref || github.ref }}

      - uses: actions/setup-dotnet@main
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore -maxcpucount:1

      - run: dotnet pack --configuration Release --no-build

      - uses: NuGet/login@v1
        id: login
        with:
          user: dpine

      - name: Publish packages
        run: |
          shopt -s nullglob
          packages=()
          for package in artifacts/package/release/*.nupkg; do
            if [[ "$(basename "$package")" == Blazor.Notifications.[0-9]*.nupkg ]]; then
              echo "::notice::Skipping Blazor.Notifications because that NuGet ID is owned by another publisher."
              continue
            fi
            packages+=("$package")
          done

          if (( ${#packages[@]} == 0 )); then
            echo "::error::No publishable NuGet packages were produced."
            exit 1
          fi

          dotnet nuget push --skip-duplicate "${packages[@]}" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
