    <script>
        // Pre-paint theme apply — runs *before* Blazor boots so we never see a
        // light/dark flash on reload. All subsequent theme work goes through
        // Blazor JS interop via theme.js.
        (function () {
            try {
                var stored = localStorage.getItem('theme') || 'dark';
                var resolved = stored === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : stored;
                document.documentElement.classList.toggle('dark', resolved === 'dark');
                document.documentElement.setAttribute('data-theme', resolved);
            } catch (e) { /* ignore */ }
        })();
    </script>

    <script>
        (() => {
            const retryableStatusCodes = new Set([408, 429, 500, 502, 503, 504]);
            const maxBootResourceAttempts = 3;
            const errorUi = document.getElementById('blazor-error-ui');
            const splashStage = document.getElementById('splash-stage');
            const splashCount = document.getElementById('splash-count');
            const splashProgress = document.getElementById('splash-progress');
            const splashProgressFill = document.getElementById('splash-progress-fill');
            const splashFact = document.getElementById('splash-fact');
            const splashFacts = [
                'Projecting browser promises into typed asynchronous C#.',
                'Keeping browser-owned references explicit and disposable.',
                'Mapping lib.dom.d.ts without handwritten JavaScript adapters.',
                'Preserving unions, callbacks, events, and structured values.'
            ];
            let requestedResources = 0;
            let loadedResources = 0;
            let highestBootProgress = 4;
            let factIndex = 0;
            const factTimer = window.setInterval(() => {
                factIndex = (factIndex + 1) % splashFacts.length;
                splashFact.textContent = splashFacts[factIndex];
            }, 1800);

            errorUi.querySelector('.reload').addEventListener('click', () => location.reload());
            errorUi.querySelector('.dismiss').addEventListener('click', () => {
                errorUi.hidden = true;
                errorUi.style.removeProperty('display');
            });

            function loadBootResource(type, _name, defaultUri, integrity) {
                updateBootStage(type);
                if (type === 'dotnetjs') {
                    return defaultUri;
                }

                requestedResources++;
                updateBootProgress();
                return fetchBootResourceWithRetry(defaultUri, integrity).then(response => {
                    if (response.ok) {
                        loadedResources++;
                        updateBootProgress();
                    }
                    return response;
                });
            }

            async function fetchBootResourceWithRetry(defaultUri, integrity) {
                for (let attempt = 1; attempt <= maxBootResourceAttempts; attempt++) {
                    const uri = new URL(defaultUri, document.baseURI);
                    if (attempt > 1) {
                        uri.searchParams.set('blazor-retry', `${attempt - 1}-${Date.now()}`);
                    }

                    const requestOptions = {
                        cache: attempt === 1 ? 'default' : 'reload'
                    };
                    if (integrity) {
                        requestOptions.integrity = integrity;
                    }

                    try {
                        const response = await fetch(uri, requestOptions);
                        if (response.ok ||
                            !retryableStatusCodes.has(response.status) ||
                            attempt === maxBootResourceAttempts) {
                            return response;
                        }
                    } catch (error) {
                        if (attempt === maxBootResourceAttempts) {
                            throw error;
                        }
                    }

                    await new Promise(resolve =>
                        setTimeout(resolve, 200 * 2 ** (attempt - 1)));
                }
            }

            function updateBootStage(type) {
                splashStage.textContent = type === 'assembly' || type === 'pdb'
                    ? 'Loading generated .NET assemblies'
                    : type === 'dotnetjs' || type.includes('wasm')
                        ? 'Starting the WebAssembly runtime'
                        : type === 'globalization'
                            ? 'Loading globalization data'
                            : 'Loading application resources';
            }

            function updateBootProgress() {
                const total = Math.max(requestedResources, 1);
                const estimatedPercent =
                    Math.min(92, 8 + Math.round((loadedResources / total) * 84));
                highestBootProgress = Math.max(highestBootProgress, estimatedPercent);
                setBootProgress(highestBootProgress);
                splashCount.textContent =
                    `${loadedResources} of ${requestedResources} runtime files ready`;
            }

            function setBootProgress(percent) {
                splashProgress.setAttribute('aria-valuenow', String(percent));
                splashProgressFill.style.width = `${percent}%`;
            }

            async function startApplication() {
                splashStage.textContent = 'Loading application resources';

                try {
                    await Blazor.start({ loadBootResource });
                } catch (error) {
                    console.error('Blazor failed to start.', error);
                    splashStage.textContent = 'Startup failed';
                    splashFact.textContent = 'Reload to retry the application startup.';
                    errorUi.hidden = false;
                    errorUi.style.display = 'flex';
                } finally {
                    window.clearInterval(factTimer);
                }
            }

            startApplication();
        })();
    </script>
